<!doctype html><html><head><meta charset="utf-8"><title>Coliseum Approved Sprite Review</title><style>body{background:#0d111c;color:#e9e7e2;font:15px system-ui;max-width:1050px;margin:30px auto;padding:0 18px}h1{font-size:24px}section{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#1b2639;border:1px solid #42516a;border-radius:12px;padding:16px}canvas{width:100%;image-rendering:pixelated;background:#24334b;border-radius:8px}select,button{padding:8px;border-radius:6px;background:#344761;color:white;border:0}p{color:#aebbd0}@media(max-width:700px){section{grid-template-columns:1fr}}</style></head><body><h1>INTERDIMENSIONAL COLISEUM — APPROVED ART</h1><p>Original extracted sprites from the approved character design board. No reinterpretation or redrawing. Preview is standalone; combat logic is not included.</p><section id="cards"></section><script>
const animations={bastion:['idle','walk','dash','attack','loss','win'],vesper:['idle','walk','shoot','roll','loss','win']};const cards=document.querySelector('#cards');for(const key of Object.keys(animations)){const div=document.createElement('div');div.className='card';div.innerHTML=`<h2>${key.toUpperCase()}</h2><select></select><canvas width="450" height="240"></canvas><p>4 original frames · 104 × 76 pixels per frame</p>`;const sel=div.querySelector('select'),can=div.querySelector('canvas'),ctx=can.getContext('2d');for(const a of animations[key])sel.add(new Option(a,a));const img=new Image();function load(){img.src='assets/characters/'+key+'/'+sel.value+'.png'}sel.onchange=load;load();function draw(t){ctx.fillStyle='#24334b';ctx.fillRect(0,0,450,240);ctx.strokeStyle='#5d718e';ctx.beginPath();ctx.moveTo(0,205);ctx.lineTo(450,205);ctx.stroke();if(img.complete&&img.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(img,Math.floor(t/160)%4*104,0,104,76,69,42,312,228)}requestAnimationFrame(draw)}requestAnimationFrame(draw);cards.appendChild(div)}
</script></body></html>
