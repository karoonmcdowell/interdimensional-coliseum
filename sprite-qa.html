<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coliseum Sprite QA — Develop</title><style>body{background:#101825;color:#f2f0e9;font:14px system-ui;margin:0;padding:24px}h1{font-size:22px}canvas{max-width:100%;background:#202d40;border:1px solid #46546b}button{padding:9px;margin:4px}a{color:#8ddaff}#info{padding:10px}</style></head><body><h1>Sprite QA — Experimental Build</h1><p>Original art, automated frame alignment. Not published to the main game.</p><p><a href="index.html">Return to game</a></p><div id="info">Loading…</div><canvas id="qa" width="800" height="720"></canvas><p>Each row cycles through one animation. Vertical lines mark frame centers; horizontal lines mark ground anchors.</p><script src="sprites.js?v=05e-preview"></script><script>const canvas=document.querySelector('#qa'),ctx=canvas.getContext('2d'),info=document.querySelector('#info');const rows=[['BASTION','idle'],['BASTION','walk'],['BASTION','ability_dash'],['BASTION','attack'],['BASTION','loss'],['BASTION','win'],['VESPER','idle'],['VESPER','walk'],['VESPER','ability_shoot'],['VESPER','ability_roll'],['VESPER','loss'],['VESPER','win']];canvas.height=rows.length*112+40;function tick(now){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.font='14px system-ui';rows.forEach(([key,anim],i)=>{let x=280+(i%2)*240,y=42+i*112;ctx.strokeStyle='#58667b';ctx.beginPath();ctx.moveTo(x,y-20);ctx.lineTo(x,y+10);ctx.moveTo(x-70,y);ctx.lineTo(x+70,y);ctx.stroke();ctx.fillStyle='#f2f0e9';ctx.fillText(key+' / '+anim,20,y-18);window.ColiseumSprites.render(ctx,{key,x,y,alive:true,facing:1,color:'#fff'},now/1000,{animation:anim,scale:1});});const r=window.ColiseumSprites.readiness();info.textContent='Sprite animations ready: '+r.ready+' / '+r.total+(r.missing.length?' (loading/missing: '+r.missing.join(', ')+')':'');requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></body></html>
