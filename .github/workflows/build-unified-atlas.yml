name: Build unified approved sprite atlas
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'assets/source/atlas-part-*.txt'
      - 'tools/decode_atlas.py'
      - '.github/workflows/build-unified-atlas.yml'
permissions:
  contents: write
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 numpy==2.2.6 brotli==1.1.0
      - run: python tools/decode_atlas.py
      - name: Commit validated atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/coliseum-atlas.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate validated 48-frame unified character atlas [skip ci]"
            git push origin HEAD:develop
          fi
