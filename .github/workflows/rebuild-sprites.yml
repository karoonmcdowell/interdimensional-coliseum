name: Rebuild approved sprites
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'tools/rebuild_sprites.py'
      - 'coliseum_approved_art_integration/assets/characters/**/*.png'
      - '.github/workflows/rebuild-sprites.yml'
permissions:
  contents: write
jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/rebuild_sprites.py
      - name: Commit generated PNG sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild and align approved sprite sheets [skip ci]"
            git push origin HEAD:develop
          fi
